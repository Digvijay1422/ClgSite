<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Page</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8 text-center">
        <h1 class="text-4xl font-bold text-red-600 mb-4" th:text="${statusCode}">500</h1>
        <h2 class="text-2xl font-semibold text-gray-800 mb-4">Oops! Something went wrong</h2>
        <p class="text-gray-600 mb-6" th:text="${errorMessage}">An error occurred</p>
        
        <div class="mb-6">
            <a href="/" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                Go to Home
            </a>
        </div>
        
        <div class="text-gray-500 text-sm">
            <p>If the problem persists, please contact support.</p>
        </div>
    </div>
</body>
</html>
